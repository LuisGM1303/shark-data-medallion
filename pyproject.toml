[project]
name = "shark-knowledge-medallion"
version = "0.1.0"
description = "Shark Knowledge Medallion Architecture — deterministic local-first knowledge base about sharks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "duckdb>=0.9.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "requests>=2.31.0",
    "jupyterlab>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.setuptools]
package-dir = {"src" = "src"}
packages = [
    "src",
    "src.bronze",
    "src.config",
    "src.gold",
    "src.merge",
    "src.resolver",
    "src.silver",
    "src.warehouse",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
